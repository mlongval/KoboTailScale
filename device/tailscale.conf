# tailscale.conf — sourced by tailscale-ctl.sh on the device.
# Plain shell assignments. Edit on the Kobo at
# /mnt/onboard/.adds/tailscale/tailscale.conf; changes take effect next start.

# Name this device shows up as in the Tailscale admin console.
HOSTNAME_TS="kobo-elipsa"

# Flags passed to `tailscale up`.
#   --accept-dns=false   the Kobo has no DNS manager; see the notes in
#                        tailscale-ctl.sh. Do not turn this on without also
#                        solving resolv.conf being rewritten on WiFi connect.
#   --accept-routes      use subnet routes advertised by other nodes.
UP_ARGS="--accept-dns=false --accept-routes"

# With MagicDNS off, tailnet peers are written into /etc/hosts on every start
# and removed on stop, so KOReader can use `http://ubuntu-s1:18090` rather than
# a 100.x literal. Set to 0 to leave /etc/hosts alone.
MANAGE_HOSTS=1

# Seconds to wait for WiFi (a default route) before starting the daemon anyway.
WIFI_WAIT=20
